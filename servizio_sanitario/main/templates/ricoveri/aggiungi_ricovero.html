<div class="d-flex align-items-end mb-3">
  <div class="flex-grow-1">
      <label for="id_cittadino" class="form-label fw-semibold">Paziente Esistente: <span class="text-danger">*</span></label>
      {{ form.CSSN }}
  </div>
  <button type="button" class="btn btn-outline-dark ms-3 mb-1 px-2 py-2 lh-1" data-bs-toggle="modal" data-bs-target="#modaleNuovoPaziente">
      <i class="bi bi-plus-lg"></i> Nuovo
  </button>
</div>

<hr>

<div class="row g-3 mb-3">
  <div class="col-md-6">
      <label for="id_codOspedale" class="form-label fw-semibold">Ospedale: <span class="text-danger">*</span></label>
      {{ form.codOspedale }}
  </div>
  <div class="col-md-6">
      <label for="id_data_ingresso" class="form-label fw-semibold">Data Ingresso: <span class="text-danger">*</span></label>
      {{ form.data_ingresso }}
  </div>
  <div class="col-md-6">
      <label for="id_durata" class="form-label fw-semibold">Durata (gg): <span class="text-danger">*</span></label>
      {{ form.durata }}
  </div>
  <div class="col-md-6">
      <label for="id_costo" class="form-label fw-semibold">Costo (€): <span class="text-danger">*</span></label>
      {{ form.costo }}
  </div>
</div>
<div class="mb-3">
  <label for="id_motivo" class="form-label fw-semibold">Motivo: <span class="text-danger">*</span></label>
  {{ form.motivo }}
</div>
<div class="mb-3">
  <label for="id_patologie" class="form-label fw-semibold">Patologie:</label>
  {{ form.patologie }}
</div>

<p class="text-muted small mt-4 mb-0"><span class="text-danger">*</span> Campi obbligatori</p>


{{ form.stato.as_hidden }}
