<!-- Sezione per selezionare un paziente esistente o aprirne uno nuovo -->
<div class="d-flex align-items-end mb-3"> <!-- Modificato: align-items-end per allineare in basso -->
  <div class="flex-grow-1">
      <label for="id_cittadino" class="form-label fw-semibold">Paziente Esistente:</label>
      <!-- Questo è il menu a tendina per i pazienti esistenti -->
      {{ form.CSSN }}
  </div>
  <!-- Modificato: rimosso mt-3 e aggiunto mb-1 per un piccolo margine dal basso -->
  <button type="button" class="btn btn-outline-success ms-3 mb-1 px-2 py-2 lh-1" data-bs-toggle="modal" data-bs-target="#modaleNuovoPaziente">
      <i class="bi bi-plus-lg"></i> Nuovo
  </button>
</div>

<hr>

<!-- Campi specifici del ricovero -->
<div class="row g-3 mb-3">
  <div class="col-md-6">
      <label for="id_codOspedale" class="form-label fw-semibold">Ospedale:</label>
      {{ form.codOspedale }}
  </div>
  <div class="col-md-6">
      <label for="id_data_ingresso" class="form-label fw-semibold">Data Ingresso:</label>
      {{ form.data_ingresso }}
  </div>
  <div class="col-md-6">
      <label for="id_durata" class="form-label fw-semibold">Durata (gg):</label>
      {{ form.durata }}
  </div>
  <div class="col-md-6">
      <label for="id_costo" class="form-label fw-semibold">Costo (€):</label>
      {{ form.costo }}
  </div>
</div>
<div class="mb-3">
  <label for="id_motivo" class="form-label fw-semibold">Motivo:</label>
  {{ form.motivo }}
</div>
<div class="mb-3">
  <label for="id_patologie" class="form-label fw-semibold">Patologie:</label>
  {{ form.patologie }}
</div>

<!-- Campo nascosto per lo stato del ricovero -->
{{ form.stato.as_hidden }}
