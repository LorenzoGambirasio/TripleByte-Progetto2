<div class="card shadow-sm p-4 rounded-4 border-0">
  <h5 class="text-center border-bottom pb-2 mb-3">Filtri</h5>

  <form method="get" id="filtriOspedaliForm">
    <div class="mb-3">
      <label for="nome-ospedale" class="form-label">Nome Ospedale:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="nome-ospedale" name="nome" placeholder="Es: Ospedale San Raffaele..." value="{{ request.GET.nome }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="nome-ospedale" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="citta-ospedale" class="form-label">Città:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="citta-ospedale" name="città" placeholder="Es: Bergamo..." value="{{ request.GET.città }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="citta-ospedale" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-4">
      <label for="direttore-ospedale" class="form-label">Direttore Sanitario:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="direttore-ospedale" name="direttore" placeholder="Es: Anna Lombardi..." value="{{ request.GET.direttore }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="direttore-ospedale" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary custom-apply-filters-btn">Applica Filtri</button>
      <a href="{% url 'ospedali' %}" class="btn btn-secondary">Resetta Filtri</a>
    </div>
  </form>
</div>
