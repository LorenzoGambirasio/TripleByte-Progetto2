<div class="card shadow-sm p-4 rounded-4 border-0">
  <h5 class="text-center border-bottom pb-2 mb-3">Filtri</h5>

  <form method="get" id="filtriCittadiniForm">
    <!-- Campi esistenti (nome, cognome, etc.) -->
    <div class="mb-3">
      <label for="nome-cittadino" class="form-label">Nome:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="nome-cittadino" name="nome" placeholder="Es: Mario..." value="{{ request.GET.nome }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="nome-cittadino" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="cognome-cittadino" class="form-label">Cognome:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="cognome-cittadino" name="cognome" placeholder="Es: Rossi..." value="{{ request.GET.cognome }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="cognome-cittadino" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="luogo-nascita" class="form-label">Luogo Nascita:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="luogo-nascita" name="luogo" placeholder="Es: Milano..." value="{{ request.GET.luogo }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="luogo-nascita" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="indirizzo-cittadino" class="form-label">Indirizzo:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="indirizzo-cittadino" name="indirizzo" placeholder="Es: Via Roma 1, Milano" value="{{ request.GET.indirizzo }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="indirizzo-cittadino" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="cssn-cittadino" class="form-label">CSSN:</label>
      <div class="input-group">
        <input type="text" class="form-control" id="cssn-cittadino" name="cssn" placeholder="Es: ABC..." value="{{ request.GET.cssn }}">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="cssn-cittadino" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="stato-cittadino" class="form-label">Stato:</label>
      <div class="input-group">
        <select class="form-select select2-filter" id="stato-cittadino" name="stato" data-placeholder="Tutti gli stati">
          <option value=""></option>
          <option value="Domicilio" {% if request.GET.stato == "Domicilio" %}selected{% endif %}>Domicilio</option>
          <option value="Ricoverato" {% if request.GET.stato == "Ricoverato" %}selected{% endif %}>Ricoverato</option>
          <option value="Deceduto" {% if request.GET.stato == "Deceduto" %}selected{% endif %}>Deceduto</option>
        </select>
      </div>
    </div>

    <!-- NUOVO BLOCCO PER IL FILTRO SUI RICOVERI -->
    <div class="mb-4">
        <label class="form-label">Numero Ricoveri:</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-journal-medical"></i></span>
            <input type="number" class="form-control" name="ricoveri_min" placeholder="Da" value="{{ request.GET.ricoveri_min }}" min="0" step="1">
            <input type="number" class="form-control" name="ricoveri_max" placeholder="A" value="{{ request.GET.ricoveri_max }}" min="0" step="1">
        </div>
    </div>
    <!-- FINE NUOVO BLOCCO -->

    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-primary custom-apply-filters-btn">Applica Filtri</button>
      <a href="{% url 'cittadini' %}" class="btn btn-secondary">Resetta Filtri</a>
    </div>
  </form>
</div>
