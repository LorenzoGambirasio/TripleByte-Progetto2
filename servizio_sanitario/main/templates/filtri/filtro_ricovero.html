<div class="card shadow-sm p-4 rounded-4 border-0">
  <h5 class="text-center border-bottom pb-2 mb-3">Filtri</h5>

  <form method="GET" id="filtriRicoveriForm">

    <div class="mb-3">
      <label for="cssn-ricovero">CSSN Paziente:</label>
      <div class="input-group">
        <input type="text" id="cssn-ricovero" name="cssn_form" value="{{ filtri_attivi.cssn }}" class="form-control" placeholder="Es: ABC...">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="cssn-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="nome-ricovero">Nome:</label>
      <div class="input-group">
        <input type="text" id="nome-ricovero" name="nome" value="{{ filtri_attivi.nome }}" class="form-control" placeholder="Es: Mario...">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="nome-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="cognome-ricovero">Cognome:</label>
      <div class="input-group">
        <input type="text" id="cognome-ricovero" name="cognome" value="{{ filtri_attivi.cognome }}" class="form-control" placeholder="Es: Rossi...">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="cognome-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="ospedale-ricovero">Ospedale:</label>
      <div class="input-group">
        <select id="ospedale-ricovero" name="ospedale" class="form-select select2-filter" data-placeholder="Tutti gli ospedali"> {# Aggiunto select2-filter e data-placeholder #}
          <option value=""></option> {# Valore vuoto per il placeholder #}
          {% for o in ospedali %}
            <option value="{{ o.codice }}" {% if filtri_attivi.ospedale == o.codice %}selected{% endif %}>{{ o.nome }}</option>
          {% endfor %}
        </select>
        {# Il pulsante clear-filter-btn qui non è più necessario se Select2 ha il suo clear #}
      </div>
    </div>

    <div class="mb-3">
      <label for="data_da-ricovero">Da:</label>
      <div class="input-group">
        <input type="date" id="data_da-ricovero" name="data_da" value="{{ filtri_attivi.data_da }}" class="form-control">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="data_da-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="data_a-ricovero">A:</label>
      <div class="input-group">
        <input type="date" id="data_a-ricovero" name="data_a" value="{{ filtri_attivi.data_a }}" class="form-control">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="data_a-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="motivo-ricovero">Motivo:</label>
      <div class="input-group">
        <input type="text" id="motivo-ricovero" name="motivo" value="{{ filtri_attivi.motivo }}" class="form-control" placeholder="Cerca nel motivo...">
        <button type="button" class="btn btn-outline-secondary clear-filter-btn" data-target="motivo-ricovero" title="Svuota campo">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="patologia-ricovero">Patologia:</label>
      <div class="input-group">
        {# Select per Select2 multiplo #}
        <select id="patologia-ricovero" name="nome_patologia" class="form-select select2-filter" multiple="multiple" data-placeholder="Seleziona una o più patologie"> 
          {% for p in patologie %}
            <option value="{{ p.nome }}" 
                    {% if p.nome in filtri_attivi.nome_patologia %}selected{% endif %}> 
              {{ p.nome }}
            </option>
          {% endfor %}
        </select>
        {# Il pulsante clear non è necessario qui, Select2 ha il suo #}
      </div>
    </div>

    <div class="mb-4">
      <label for="stato-ricovero">Stato:</label>
      <div class="input-group">
        <select id="stato-ricovero" name="stato" class="form-select select2-filter" data-placeholder="Tutti gli stati"> {# Aggiunto select2-filter e data-placeholder #}
          <option value=""></option> {# Valore vuoto per il placeholder #}
          <option value="0" {% if filtri_attivi.stato == "0" %}selected{% endif %}>Attivo</option>
          <option value="1" {% if filtri_attivi.stato == "1" %}selected{% endif %}>Trasferito</option>
          <option value="2" {% if filtri_attivi.stato == "2" %}selected{% endif %}>Dimesso</option>
          <option value="3" {% if filtri_attivi.stato == "3" %}selected{% endif %}>Deceduto</option>
        </select>
        {# Il pulsante clear-filter-btn qui non è più necessario se Select2 ha il suo clear #}
      </div>
    </div>

    <div class="d-grid gap-2 mt-4">
      <button type="submit" class="btn btn-primary custom-apply-filters-btn">Applica Filtri</button>
      <a href="{% url 'lista_ricoveri' %}" class="btn btn-secondary">Resetta Filtri</a>
    </div>
  </form>
</div>
